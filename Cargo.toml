[package]
name = "glove80-listener"
version = "0.1.0"
edition = "2021"
default-run = "glove80-listener"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Threading"] }
toml_edit = "0.22"
tiny_http = "0.12"

